[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regbridge-backend"
version = "0.1.0"
description = "Evidence-grounded, version-aware FDA/CDER legacy content reuse risk analyzer."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
  "types-PyYAML==6.0.12.20260815",
]

[tool.setuptools]
packages = {find = {where = ["."], include = ["app*"]}}

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
