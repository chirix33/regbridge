version: 1.0.0
snapshot_id: fda-cder-demo-v1
status: awaiting-author-approval
author_approval_required: true
author_approval_recorded: false
expert_validated: false
controls:
  case_serialization: identical-for-b0-b1
  evidence_ordering: evidence-id-ascending
  input_character_limit: 16000
  over_limit_behavior: fail-validation
  b2_semantic_capability: omitted
  b2_test_policy: rule-behavior-not-case-id-mapping
  held_out_family_description: six non-overlapping held-out fixture families
target_contexts:
  prospective-reference: &prospective
    authority: FDA
    center: CDER
    application_type: NDA
    source_standard: eCTD-3.2.2
    target_standard: eCTD-4.0
    analysis_date: 2026-08-29
    reuse_operation: reference-existing-content
    standards_snapshot_id: fda-cder-demo-v1
    scenario_mode: prospective_forward_compatibility
    metadata_plan: null
  current-operational:
    <<: *prospective
    scenario_mode: current_operational
  normalize-unnecessary-reference:
    <<: *prospective
    metadata_plan: {intent: normalize-metadata, manufacturer_partitioning: unnecessary, replacement_manufacturer_value: null}
  preserve-reference:
    <<: *prospective
    metadata_plan: {intent: preserve-existing-lifecycle, manufacturer_partitioning: unknown, replacement_manufacturer_value: null}
  unspecified-reference:
    <<: *prospective
    metadata_plan: {intent: unspecified, manufacturer_partitioning: unknown, replacement_manufacturer_value: null}
  normalize-required-explicit:
    <<: *prospective
    metadata_plan: {intent: normalize-metadata, manufacturer_partitioning: required, replacement_manufacturer_value: Northstar River Site}
  normalize-unknown:
    <<: *prospective
    metadata_plan: {intent: normalize-metadata, manufacturer_partitioning: unknown, replacement_manufacturer_value: null}
  create-new-target:
    <<: *prospective
    reuse_operation: create-new-target-artifact

