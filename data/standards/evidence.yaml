  - id: ev-m4-manufacturer-general-values
    source_id: fda-m4-ctd-organization-october-2017
    locator: "Appendix A / PDF page 25 / printed page 22"
    text: >-
      The manufacturer keyword is optional and is not recommended when manufacturer, site,
      or process differentiation is unnecessary; general umbrella values such as "all",
      "applicant", or "not specified" provide no benefit. When differentiation is useful,
      a stable firm, site, route, or process-distinguishing value may be used.
    bindingness: recommendation
