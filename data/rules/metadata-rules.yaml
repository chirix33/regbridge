    version: "1.0.0"
    title: General manufacturer value is discouraged when differentiation is unnecessary
    description: >-
      Report the nonbinding recommendation when a legacy manufacturer attribute normalizes
      to "all"; this advisory never independently forces repair or claims noncompliance.
    bindingness: recommendation
    review_status: author_adjudicated_for_demo
    verification_basis: direct_standard_encoding
    enforcement_mode: advisory
    expert_validated: false
    scenario_mode: prospective_forward_compatibility
    scope: &m2_scope
      authority: FDA
      center: CDER
      application_types: [NDA]
      source_standard: eCTD-3.2.2
      target_standard: eCTD-4.0
    predicate_type: discouraged-manufacturer-value
    keyword_name: manufacturer
    normalized_value: all
    decision: null
    severity: medium
    repair_type: null
    repair_description: null
    evidence_ids: [ev-m4-manufacturer-general-values]
